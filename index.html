<script>

    /* ==================================================

    const addButton =

/* ==================================================
   ROLAGEM PERSONALIZADA
   ================================================== */

const popupArea =
    document.getElementById("popupArea");

const customScrollbar =
    document.getElementById("customScrollbar");

const customScrollbarThumb =
    document.getElementById("customScrollbarThumb");


/* ==================================================
   ATUALIZA SCROLLBAR
   ================================================== */

function atualizarScrollbar() {

    const alturaVisivel = popupArea.clientHeight;
    const alturaTotal = popupArea.scrollHeight;
    const alturaBarra = customScrollbar.clientHeight;

    console.log({
        alturaVisivel,
        alturaTotal,
        alturaBarra
    });

    if (
        alturaBarra <= 0 ||
        alturaTotal <= alturaVisivel
    ) {
        customScrollbar.style.visibility = "hidden";
        return;
    }

    customScrollbar.style.visibility = "visible";

    const proporcao =
        alturaVisivel / alturaTotal;

    const alturaThumb =
        Math.max(
            38,
            alturaBarra * proporcao
        );

    customScrollbarThumb.style.height =
        `${alturaThumb}px`;

    const maxScroll =
        alturaTotal - alturaVisivel;

    const maxThumb =
        alturaBarra - alturaThumb;

    const porcentagem =
        maxScroll > 0
            ? popupArea.scrollTop / maxScroll
            : 0;

    customScrollbarThumb.style.transform =
        `translateY(${maxThumb * porcentagem}px)`;
}


/* ==================================================
   SCROLL
   ================================================== */

popupArea.addEventListener(
    "scroll",
    atualizarScrollbar
);


/* ==================================================
   RESIZE DA JANELA
   ================================================== */

window.addEventListener(
    "resize",
    atualizarScrollbar
);


const observer = new ResizeObserver(() => {
    requestAnimationFrame(atualizarScrollbar);
});

observer.observe(popupArea);
observer.observe(lyricList);

/* ==================================================
   INICIALIZA
   ================================================== */

requestAnimationFrame(
    atualizarScrollbar
);


/* ==================================================
   ARRASTAR THUMB
   ================================================== */

let arrastandoScrollbar = false;

let inicioMouseY = 0;

let inicioScroll = 0;


/*
    Começou o arraste
*/

customScrollbarThumb.addEventListener(
    "pointerdown",
    (event) => {

        arrastandoScrollbar = true;

        inicioMouseY =
            event.clientY;

        inicioScroll =
            popupArea.scrollTop;


        event.preventDefault();


        customScrollbarThumb.setPointerCapture(
            event.pointerId
        );


        customScrollbarThumb.style.cursor =
            "grabbing";
    }
);


/*
    Movimento
*/

customScrollbarThumb.addEventListener(
    "pointermove",
    (event) => {

        if (!arrastandoScrollbar) {
            return;
        }


        const deslocamento =
            event.clientY -
            inicioMouseY;


        const alturaVisivel =
            popupArea.clientHeight;

        const alturaTotal =
            popupArea.scrollHeight;

        const alturaBarra =
            customScrollbar.clientHeight;

        const alturaThumb =
            customScrollbarThumb.offsetHeight;


        const maxScroll =
            alturaTotal -
            alturaVisivel;


        const maxThumb =
            alturaBarra -
            alturaThumb;


        if (
            maxScroll <= 0 ||
            maxThumb <= 0
        ) {
            return;
        }


        /*
            Conversão:

            movimento do mouse
            ↓
            movimento do thumb
            ↓
            movimento do conteúdo
        */

        const novoScroll =
            inicioScroll +
            (
                deslocamento /
                maxThumb
            ) *
            maxScroll;


        popupArea.scrollTop =
            Math.max(
                0,
                Math.min(
                    maxScroll,
                    novoScroll
                )
            );
    }
);


/*
    Terminou o arraste
*/

customScrollbarThumb.addEventListener(
    "pointerup",
    (event) => {

        arrastandoScrollbar = false;

        customScrollbarThumb.style.cursor =
            "grab";


        try {

            customScrollbarThumb.releasePointerCapture(
                event.pointerId
            );

        } catch {

        }
    }
);


/*
    Cancelamento
*/

customScrollbarThumb.addEventListener(
    "pointercancel",
    () => {

        arrastandoScrollbar = false;

        customScrollbarThumb.style.cursor =
            "grab";
    }
);


/* ==================================================
   INICIALIZA
   ================================================== */

atualizarScrollbar();

       deleteButton.addEventListener(

);

        /* =========================================

textArea.addEventListener(

        /* =========================================

        for (let i = 0; i < 4; i++) {

            const input =
                document.createElement("input");

            input.type = "text";
            input.inputMode = "decimal";

            input.className =
                "number-field";

            input.placeholder =
                "0";

            input.min = "0";

            /*
                Impede números muito grandes
                de ocuparem o bloquinho.
            */

input.addEventListener("input", () => {
    input.value = input.value
        .replace(/-/g, "")
        .replace(/,/g, ".");

    const primeiroPonto = input.value.indexOf(".");

    if (primeiroPonto !== -1) {
        input.value =
            input.value.slice(0, primeiroPonto + 1) +
            input.value
                .slice(primeiroPonto + 1)
                .replace(/\./g, "");
    }

    if (input.value.length > 4) {
        input.value = input.value.slice(0, 4);
    }
});
          
            numberFields.appendChild(input);
        }


        /* =========================================
           MONTA O RETÂNGULO
           ========================================= */

        item.appendChild(deleteButton);

        item.appendChild(textArea);

        item.appendChild(numberFields);

      lyricList.appendChild(item);


/*
    Atualiza a barra sem alterar
    a posição atual da tela.
*/

atualizarScrollbar();

    }


    /*
        Clique no +
    */

    addButton.addEventListener(

removeAllButton.addEventListener(

    /* ==================================================
       CONSOLE VISUAL
       ================================================== */

    const output =
        document.getElementById("console");

  /* ==================================================
   GRAVAÇÃO DO CONSOLE
   ================================================== */

let gravandoConsole = false;
let exportacaoAtiva = false;
let mediaRecorder = null;

let partesGravacao = [];

let canvasGravacao = null;

let contextoGravacao = null;

let animationGravacao = null;


let streamGravacao = null;
let escalaGravacao = 2;
    
/* ==================================================
   DESENHA O CONSOLE NO CANVAS
   ================================================== */


function desenharConsoleNoCanvas() {
    if (!gravandoConsole || !canvasGravacao || !contextoGravacao) {
        return;
    }

    const largura = output.clientWidth;
    const altura = output.clientHeight;

    if (largura <= 0 || altura <= 0) {
        animationGravacao = requestAnimationFrame(desenharConsoleNoCanvas);
        return;
    }

    // Não altere canvas.width/height aqui.
    // Redimensionar o canvas a cada frame consome recursos.
    contextoGravacao.clearRect(0, 0, largura, altura);

    const estilo = getComputedStyle(output);

    contextoGravacao.fillStyle = estilo.backgroundColor;
    contextoGravacao.fillRect(0, 0, largura, altura);

    const tamanhoFonte = parseFloat(estilo.fontSize) || 16;
    const alturaLinha = parseFloat(estilo.lineHeight) || tamanhoFonte * 1.2;

    contextoGravacao.font = `${tamanhoFonte}px ${estilo.fontFamily}`;
    contextoGravacao.textAlign = "center";
    contextoGravacao.textBaseline = "middle";

    const linhasArray = Array.from(
        output.querySelectorAll(".console-line")
    );

    if (linhasArray.length > 0) {
        const espaco = alturaLinha + 3;
        const alturaTotal = linhasArray.length * espaco;
        let y = (altura - alturaTotal) / 2 + espaco / 2;

        for (const linha of linhasArray) {
            const estiloLinha = getComputedStyle(linha);

            contextoGravacao.fillStyle = estiloLinha.color;
            contextoGravacao.fillText(
                linha.textContent || "",
                largura / 2,
                y
            );

            y += espaco;
        }
    }

    animationGravacao = requestAnimationFrame(desenharConsoleNoCanvas);
}


/* ==================================================
   INICIA GRAVAÇÃO
   ================================================== */


async function iniciarGravacaoConsole() {
    if (!window.MediaRecorder) {
        throw new Error("Este navegador não suporta gravação de vídeo.");
    }

    // Evita manter recursos de uma gravação anterior.
    if (streamGravacao) {
        streamGravacao.getTracks().forEach(track => track.stop());
        streamGravacao = null;
    }

    if (animationGravacao !== null) {
        cancelAnimationFrame(animationGravacao);
        animationGravacao = null;
    }

    gravandoConsole = false;
    partesGravacao = [];

    canvasGravacao = document.createElement("canvas");

    const largura = Math.max(1, output.clientWidth);
    const altura = Math.max(1, output.clientHeight);

    // Limita a escala para controlar o consumo de memória.
    escalaGravacao = Math.min(
        2,
        Math.max(1, window.devicePixelRatio || 1)
    );

    // O tamanho físico é definido apenas uma vez por gravação.
    canvasGravacao.width = Math.round(largura * escalaGravacao);
    canvasGravacao.height = Math.round(altura * escalaGravacao);

    contextoGravacao = canvasGravacao.getContext("2d", {
        alpha: false
    });

    if (!contextoGravacao) {
        throw new Error("Não foi possível criar o canvas da gravação.");
    }

    contextoGravacao.setTransform(
        escalaGravacao, 0,
        0, escalaGravacao,
        0, 0
    );

    streamGravacao = canvasGravacao.captureStream(30);

    const formatos = [
        "video/mp4",
        "video/webm;codecs=vp8",
        "video/webm"
    ];

    const formato = formatos.find(tipo =>
        MediaRecorder.isTypeSupported(tipo)
    );

    if (!formato) {
        streamGravacao.getTracks().forEach(track => track.stop());
        streamGravacao = null;
        throw new Error("Nenhum formato de vídeo compatível foi encontrado.");
    }

    try {
        mediaRecorder = new MediaRecorder(streamGravacao, {
            mimeType: formato
        });

        mediaRecorder.ondataavailable = event => {
            if (event.data && event.data.size > 0) {
                partesGravacao.push(event.data);
            }
        };

        mediaRecorder.onerror = event => {
            console.error("Erro durante a gravação:", event.error || event);
        };

        gravandoConsole = true;

        // Desenha o primeiro frame antes de iniciar a captura.
        desenharConsoleNoCanvas();

        mediaRecorder.start(100);
    } catch (erro) {
        gravandoConsole = false;

        if (animationGravacao !== null) {
            cancelAnimationFrame(animationGravacao);
            animationGravacao = null;
        }

        if (streamGravacao) {
            streamGravacao.getTracks().forEach(track => track.stop());
            streamGravacao = null;
        }

        mediaRecorder = null;
        canvasGravacao = null;
        contextoGravacao = null;

        throw erro;
    }
}

/* ==================================================
   PARA GRAVAÇÃO
   ================================================== */


function pararGravacaoConsole(descartar = false) {
    return new Promise((resolve, reject) => {
        const recorder = mediaRecorder;

        if (animationGravacao !== null) {
            cancelAnimationFrame(animationGravacao);
            animationGravacao = null;
        }

        gravandoConsole = false;

        const liberarRecursos = () => {
            if (streamGravacao) {
                streamGravacao.getTracks().forEach(track => {
                    try {
                        track.stop();
                    } catch (_) {}
                });
                streamGravacao = null;
            }

            if (canvasGravacao) {
                canvasGravacao.width = 1;
                canvasGravacao.height = 1;
            }

            canvasGravacao = null;
            contextoGravacao = null;

            if (mediaRecorder === recorder) {
                mediaRecorder = null;
            }
        };

        const limparPartes = () => {
            partesGravacao.length = 0;
            partesGravacao = [];
        };

        if (!recorder) {
            limparPartes();
            liberarRecursos();
            resolve(null);
            return;
        }

        let finalizado = false;

        const finalizar = (erro = null) => {
            if (finalizado) return;
            finalizado = true;

            let blob = null;

            if (!descartar && !erro) {
                blob = new Blob(partesGravacao, {
                    type: recorder.mimeType || "video/webm"
                });
            }

            limparPartes();
            liberarRecursos();

            if (erro) {
                reject(erro);
            } else if (!blob || blob.size === 0) {
                resolve(null);
            } else {
                resolve(blob);
            }
        };

        recorder.ondataavailable = event => {
            if (
                !descartar &&
                event.data &&
                event.data.size > 0
            ) {
                partesGravacao.push(event.data);
            }
        };

        recorder.onerror = event => {
            finalizar(
                event.error || new Error("Falha durante a gravação.")
            );
        };

        recorder.onstop = () => finalizar();

        try {
            if (recorder.state !== "inactive") {
                recorder.stop();
            } else {
                finalizar();
            }
        } catch (erro) {
            finalizar(erro);
        }
    });
}

/* ==================================================
   CONVERTE WEBM → MP4
   ================================================== */
let ffmpeg = null;
let ffmpegCarregado = false;


async function converterParaMP4(webmBlob, idExecucao) {
    if (conversaoEmAndamento) {
        throw new Error("Já existe uma conversão em andamento.");
    }

    conversaoEmAndamento = true;

    const arquivosTemporarios = ["entrada.webm", "saida.mp4"];

    async function limparArquivosTemporarios() {
        if (!ffmpegCarregado || !ffmpeg) return;

        for (const nome of arquivosTemporarios) {
            try {
                await ffmpeg.deleteFile(nome);
            } catch (_) {
                // O arquivo pode já ter sido removido.
            }
        }
    }

    try {
        if (idExecucao !== execucaoAtual || cancelamentoGravacao) {
            return null;
        }

        if (!ffmpegCarregado) {
            if (!window.FFmpegWASM) {
                await new Promise((resolve, reject) => {
                    const script = document.createElement("script");
                    script.src = "./ffmpeg/ffmpeg.js";
                    script.onload = resolve;
                    script.onerror = () => reject(
                        new Error("Não foi possível carregar ffmpeg.js")
                    );
                    document.head.appendChild(script);
                });
            }

            if (!window.FFmpegWASM) {
                throw new Error("FFmpegWASM não foi encontrado.");
            }

            ffmpeg = new FFmpegWASM.FFmpeg();

            ffmpeg.on("log", ({ message }) => {
                console.log("[FFmpeg]", message);
            });

            await ffmpeg.load({
                coreURL: new URL(
                    "ffmpeg/ffmpeg-core.js",
                    document.baseURI
                ).href,
                wasmURL: new URL(
                    "ffmpeg/ffmpeg-core.wasm",
                    document.baseURI
                ).href
            });

            ffmpegCarregado = true;
        }

        if (idExecucao !== execucaoAtual || cancelamentoGravacao) {
            return null;
        }

        await limparArquivosTemporarios();

        await ffmpeg.writeFile(
            "entrada.webm",
            new Uint8Array(await webmBlob.arrayBuffer())
        );

        if (idExecucao !== execucaoAtual || cancelamentoGravacao) {
            return null;
        }

        await ffmpeg.exec([
            "-i", "entrada.webm",
            "-c:v", "libx264",
            "-pix_fmt", "yuv420p",
            "-movflags", "+faststart",
            "saida.mp4"
        ]);

        if (idExecucao !== execucaoAtual || cancelamentoGravacao) {
            return null;
        }

        const arquivo = await ffmpeg.readFile("saida.mp4");

        if (idExecucao !== execucaoAtual || cancelamentoGravacao) {
            return null;
        }

        return new Blob([arquivo], { type: "video/mp4" });
    } finally {
        try {
            await limparArquivosTemporarios();
        } finally {
            conversaoEmAndamento = false;
        }
    }
}

            return "null";

            try {

                return JSON.stringify(
                    value,

                    2

            }

            catch {

                return String(value);

            }
        }

        return String(value);
    }

if (!gravar) {

    const codigoJSS = `

const lyric = [];

let memoria = "";

function sepletra () {

  for (let i = 0; i < lyric.length; i++){

    lyric[i][0] = lyric[i][0].split(" ");

  };

  return;
};


function timer (t) {
  return new Promise ((resolve) => {

    const inicio = performance.now();

    function verificar() {

      if (!estaExecutando()) {
        resolve();
        return;
      }

      const passou =
        performance.now() - inicio;

      if (passou >= t) {
        resolve();
        return;
      }

      setTimeout(
        verificar,
        Math.min(10, t - passou)
      );

    }

    verificar();

  });
};


async function falante (t, q, l) {

  let memorypad = "";

  if (memoria !== "") {

    memorypad = memoria;

  };


  for (let i = 0; i < q; i++) {

    for (
      let y = 0;
      y < lyric[l][0][i].length;
      y++
    ) {

      console.clear();

      console.log(
        memorypad +
        lyric[l][0][i][y]
      );

      memorypad =
        memorypad +
        lyric[l][0][i][y];

      await timer(t);

    };

  };


  if (lyric[l][lyric[l].length - 4] > 0) {

    memoria = "";
    memorypad = "";

  };


  if (lyric[l][lyric[l].length - 1] > 0) {

    if (
      lyric[l][lyric[l].length - 4] <= 0
    ) {

      memoria = memorypad + " ";

    } else {

      memoria = "";
      memorypad = "";

    };

  };

  return;

};


async function escrita (l) {

  let quantia =
    lyric[l][0].length;

  let espaco =
    quantia - 1;


  for (let i = 0; i < quantia; i++) {

    lyric[l][0][i] =
      lyric[l][0][i].split("");


    if (espaco > 0) {

      lyric[l][0][i].push(" ");

      espaco--;

    };

  };


  let total = 0;


  for (let i = 0; i < quantia; i++) {

    total =
      total +
      lyric[l][0][i].length;

  };


  let tempo =
    (
      lyric[l][lyric[l].length - 3]
      / total
    ) * 1000;


  await falante(
    tempo,
    quantia,
    l
  );


  if (
    lyric[l][lyric[l].length - 2] > 0
  ) {

    await timer(
      lyric[l][lyric[l].length - 2] * 1000
    );

  };

  return;

};


async function song () {

  await sepletra();

  for (
    let i = 0;
    i < lyric.length;
    i++
  ) {

    await escrita(i);

  };

};


await song();

`;

/* ==================================================

function gerarLyric() {

    const trechos =
        document.querySelectorAll(".lyric-item");

    const lyric =
        Array.from(trechos).map(item => {

            const texto =
                item.querySelector(".lyric-text").value;

            const numeros =
                Array.from(
                    item.querySelectorAll(".number-field")
                ).map(input => {

                    return Number(input.value) || 0;

                });

            return [
                texto,
                ...numeros
            ];

        });

    return lyric;

async function executarLetra(gravar = false) {
    execucaoAtual++;

    const idExecucao = execucaoAtual;
    let webm = null;

    if (gravar) {
        cancelamentoGravacao = false;
        exportacaoAtiva = true;
    }

    try {
        const dadosLyric = gerarLyric();

        const codigo = codigoJSS.replace(
            "const lyric = [];",
            `const lyric = ${JSON.stringify(dadosLyric)};`
        );

        if (gravar) {
            customConsole.clear();
            await iniciarGravacaoConsole();
        }

        // Se foi cancelado durante a inicialização, não executa a letra.
        if (
            idExecucao !== execucaoAtual ||
            (gravar && cancelamentoGravacao)
        ) {
            return;
        }

        await executarCodigo(codigo, idExecucao, gravar);

        if (!gravar) return;

        // Não exporta um vídeo incompleto após o cancelamento.
        if (
            idExecucao !== execucaoAtual ||
            cancelamentoGravacao
        ) {
            return;
        }

        // Dá tempo para o último frame e os dados finais serem registrados.
        await new Promise(resolve => {
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    setTimeout(resolve, 250);
                });
            });
        });

        if (
            idExecucao !== execucaoAtual ||
            cancelamentoGravacao
        ) {
            return;
        }

        webm = await pararGravacaoConsole(false);

        if (!webm) {
            throw new Error("Não foi possível finalizar o vídeo.");
        }

        if (
            idExecucao !== execucaoAtual ||
            cancelamentoGravacao
        ) {
            webm = null;
            return;
        }

        let mp4;

        if (webm.type.includes("mp4")) {
            mp4 = webm;
        } else {
            mp4 = await converterParaMP4(webm, idExecucao);
        }

        if (
            !mp4 ||
            idExecucao !== execucaoAtual ||
            cancelamentoGravacao
        ) {
            mp4 = null;
            return;
        }

        baixarMP4(mp4);
} finally {
    webm = null;

    if (gravar) {
        if (gravandoConsole || mediaRecorder) {
            await pararGravacaoConsole(true).catch(() => {});
        }

        // Descarta qualquer parte que ainda tenha ficado na memória.
        partesGravacao.length = 0;
        partesGravacao = [];

const foiCancelada = gravar && cancelamentoGravacao;

    customConsole.log("");

}

    if (gravar) {
        exportacaoAtiva = false;
        cancelamentoGravacao = false;
    }
}
}

/* ==================================================
   CONVERSÃO RGB → HSV
   ================================================== */

function rgbToHsv(r, g, b) {

    r /= 255;
    g /= 255;
    b /= 255;

    const maior =
        Math.max(r, g, b);

    const menor =
        Math.min(r, g, b);

    const diferenca =
        maior - menor;

    let h = 0;
    let s = 0;

    const v = maior;

    if (diferenca !== 0) {

        s =
            diferenca / maior;

        if (maior === r) {

            h =
                60 *
                (
                    ((g - b) / diferenca) % 6
                );

        } else if (maior === g) {

            h =
                60 *
                (
                    ((b - r) / diferenca) + 2
                );

        } else {

            h =
                60 *
                (
                    ((r - g) / diferenca) + 4
                );

        }

    }

    if (h < 0) {
        h += 360;
    }

    return {
        h,
        s,
        v
    };
}


/* ==================================================
   CONVERSÃO HSV → RGB
   ================================================== */

function hsvToRgb(h, s, v) {

    const c =
        v * s;

    const x =
        c *
        (
            1 -
            Math.abs(
                ((h / 60) % 2) - 1
            )
        );

    const m =
        v - c;

    let r = 0;
    let g = 0;
    let b = 0;

    if (h < 60) {

        r = c;
        g = x;

    } else if (h < 120) {

        r = x;
        g = c;

    } else if (h < 180) {

        g = c;
        b = x;

    } else if (h < 240) {

        g = x;
        b = c;

    } else if (h < 300) {

        r = x;
        b = c;

    } else {

        r = c;
        b = x;

    }

    return {
        r: Math.round((r + m) * 255),
        g: Math.round((g + m) * 255),
        b: Math.round((b + m) * 255)
    };
}


/* ==================================================
   HEX → RGB
   ================================================== */

function hexToRgb(hex) {

    hex =
        hex.replace("#", "");

    return {
        r: parseInt(
            hex.slice(0, 2),
            16
        ),

        g: parseInt(
            hex.slice(2, 4),
            16
        ),

        b: parseInt(
            hex.slice(4, 6),
            16
        )
    };
}


/* ==================================================
   RGB → HEX
   ================================================== */

function rgbToHex(r, g, b) {

    return "#" +
        [r, g, b]
            .map(valor =>
                valor
                    .toString(16)
                    .padStart(2, "0")
            )
            .join("");
}

        colorGradient.getBoundingClientRect();

    let x =
        (event.clientX - rect.left)
        / rect.width;

    let y =
        (event.clientY - rect.top)
        / rect.height;


    x =
        Math.max(
            0,
            Math.min(1, x)
        );

    y =
        Math.max(
            0,
            Math.min(1, y)
        );


    hsvAtual.s = x;
    hsvAtual.v = 1 - y;


    const rgb =
        hsvToRgb(
            hsvAtual.h,
            hsvAtual.s,
            hsvAtual.v
        );


    aplicarCorRGB(
        rgb.r,
        rgb.g,
        rgb.b
    );

    atualizarGradiente();
}

const FONT_DB_NAME = "GeLetraFontesDB";
const FONT_STORE_NAME = "fontes";

const FONT_MAX_SIZE = 500 * 1024;

const fontePadraoConsole =
    '"SFMono-Regular", Consolas, "Liberation Mono", monospace';


/* ABRIR BANCO LOCAL */

function abrirBancoFontes() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(FONT_DB_NAME, 1);

        request.onupgradeneeded = () => {
            const db = request.result;

            if (!db.objectStoreNames.contains(FONT_STORE_NAME)) {
                db.createObjectStore(FONT_STORE_NAME, {
                    keyPath: "id"
                });
            }
        };

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
}


/* OPERAÇÕES NO BANCO */

async function salvarRegistroFonte(fonte) {
    const db = await abrirBancoFontes();

    return new Promise((resolve, reject) => {
        const tx = db.transaction(FONT_STORE_NAME, "readwrite");

        tx.objectStore(FONT_STORE_NAME).put(fonte);

        tx.oncomplete = () => {
            db.close();
            resolve();
        };

        tx.onerror = () => {
            db.close();
            reject(tx.error);
        };

        tx.onabort = () => {
            db.close();
            reject(tx.error);
        };
    });
}

async function listarRegistrosFontes() {
    const db = await abrirBancoFontes();

    return new Promise((resolve, reject) => {
        const tx = db.transaction(FONT_STORE_NAME, "readonly");
        const request = tx.objectStore(FONT_STORE_NAME).getAll();

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);

        tx.oncomplete = () => db.close();
        tx.onerror = () => db.close();
    });
}

async function excluirRegistroFonte(id) {
    const db = await abrirBancoFontes();

    return new Promise((resolve, reject) => {
        const tx = db.transaction(FONT_STORE_NAME, "readwrite");

        tx.objectStore(FONT_STORE_NAME).delete(id);

        tx.oncomplete = () => {
            db.close();
            resolve();
        };

        tx.onerror = () => {
            db.close();
            reject(tx.error);
        };

        tx.onabort = () => {
            db.close();
            reject(tx.error);
        };
    });
}


/* CARREGAR UMA FONTE NO NAVEGADOR */

async function carregarFonteNoNavegador(fonte) {
    const dados = await fonte.blob.arrayBuffer();

    const face = new FontFace(
        fonte.family,
        dados
    );

    await face.load();

    document.fonts.add(face);

    return face;
}


/* APLICAR UMA FONTE PERSONALIZADA */

async function selecionarFontePersonalizada(fonte) {
    try {
        await carregarFonteNoNavegador(fonte);

        fonteConsole = `"${fonte.family}"`;

        output.style.fontFamily = fonteConsole;

        localStorage.setItem(
            "jssConsoleFonte",
            fonteConsole
        );

        customFontMessage.textContent =
            `Fonte "${fonte.name}" selecionada.`;

    } catch (erro) {
        console.error(erro);

        customFontMessage.textContent =
            "Não foi possível carregar essa fonte.";
    }
}


/* EXIBIR AS FONTES PERSONALIZADAS */

async function atualizarListaFontesPersonalizadas() {
    const fontes = await listarRegistrosFontes();

    customFontList.replaceChildren();

    fontes.sort((a, b) =>
        a.name.localeCompare(b.name, "pt-BR")
    );

    for (const fonte of fontes) {
        const linha = document.createElement("div");
        linha.className = "custom-font-row";

        const selecionar = document.createElement("button");
        selecionar.type = "button";
        selecionar.className = "custom-font-select";
        selecionar.textContent = fonte.name;
        selecionar.title = `Usar a fonte ${fonte.name}`;

        selecionar.addEventListener("click", async () => {
            await selecionarFontePersonalizada(fonte);
        });

        const excluir = document.createElement("button");
        excluir.type = "button";
        excluir.className = "custom-font-delete";
        excluir.textContent = "×";
        excluir.title = `Excluir a fonte ${fonte.name}`;
        excluir.setAttribute(
            "aria-label",
            `Excluir a fonte ${fonte.name}`
        );

        excluir.addEventListener("click", async () => {
            try {
                const fonteAtualEstaSelecionada =
                    fonteConsole.includes(fonte.family);

                await excluirRegistroFonte(fonte.id);

                if (fonteAtualEstaSelecionada) {
                    fonteConsole = fontePadraoConsole;
                    output.style.fontFamily = fonteConsole;

                    localStorage.setItem(
                        "jssConsoleFonte",
                        fonteConsole
                    );
                }

                document.fonts.forEach(face => {
                    if (face.family === fonte.family) {
                        document.fonts.delete(face);
                    }
                });

                await atualizarListaFontesPersonalizadas();

                customFontMessage.textContent =
                    `Fonte "${fonte.name}" excluída.`;

            } catch (erro) {
                console.error(erro);

                customFontMessage.textContent =
                    "Não foi possível excluir a fonte.";
            }
        });

        linha.append(selecionar, excluir);
        customFontList.appendChild(linha);
    }
}

/* IMPORTAR UMA FONTE DE UM ZIP */

customFontUpload.addEventListener("change", async () => {
    const arquivo = customFontUpload.files[0];

    // Permite selecionar novamente o mesmo arquivo.
    customFontUpload.value = "";

    if (!arquivo) return;

    if (!arquivo.name.toLowerCase().endsWith(".zip")) {
        customFontMessage.textContent =
            "Selecione um arquivo ZIP.";
        return;
    }

    if (arquivo.size > FONT_MAX_SIZE) {
        customFontMessage.textContent =
            "O ZIP ultrapassa o limite de 500 KB.";
        return;
    }

    if (typeof JSZip === "undefined") {
        customFontMessage.textContent =
            "Não foi possível carregar o leitor de ZIP.";
        return;
    }

    uploadFontButton.disabled = true;
    customFontMessage.textContent =
        "Verificando o arquivo...";

    try {
        const zip = await JSZip.loadAsync(arquivo);

        const extensoesPermitidas =
            /\.(ttf|otf|woff2?|TTF|OTF|WOFF2?)$/i;

        const entradas = Object.values(zip.files)
            .filter(item =>
                !item.dir &&
                extensoesPermitidas.test(item.name) &&
                !item.name.split("/").some(parte =>
                    parte.startsWith(".")
                )
            );

        if (entradas.length === 0) {
            throw new Error(
                "O ZIP não contém arquivos de fonte compatíveis."
            );
        }

        // Um arquivo ZIP pode conter PDFs, textos e outros
        // arquivos. Usamos a primeira fonte encontrada.
        const entrada = entradas[0];

        const blob = await entrada.async("blob");

        if (blob.size === 0) {
            throw new Error("O arquivo de fonte está vazio.");
        }

        const nomeArquivo =
            entrada.name.split("/").pop();

        const nomeFonte =
            nomeArquivo.replace(/\.(ttf|otf|woff2?)$/i, "");

        const id =
            typeof crypto.randomUUID === "function"
                ? crypto.randomUUID()
                : `${Date.now()}-${Math.random().toString(16).slice(2)}`;

        const fonte = {
            id,
            name: nomeFonte,
            family: `GeLetraCustom_${id.replace(/-/g, "_")}`,
            blob
        };

        // Testa a fonte antes de salvá-la.
        await carregarFonteNoNavegador(fonte);

        await salvarRegistroFonte(fonte);

        await atualizarListaFontesPersonalizadas();

        await selecionarFontePersonalizada(fonte);

        customFontMessage.textContent =
            `Fonte "${nomeFonte}" adicionada com sucesso.`;

    } catch (erro) {
        console.error(erro);

        customFontMessage.textContent =
            erro.message?.includes("ZIP não contém")
                ? erro.message
                : "Não foi possível importar esse ZIP. Verifique se ele contém uma fonte válida.";
    } finally {
        uploadFontButton.disabled = false;
    }
});


/* RESTAURAR AS FONTES SALVAS AO ABRIR O SITE */

async function restaurarFontesPersonalizadas() {
    try {
        const fontes = await listarRegistrosFontes();

        for (const fonte of fontes) {
            try {
                await carregarFonteNoNavegador(fonte);
            } catch (erro) {
                console.warn(
                    `Não foi possível carregar ${fonte.name}:`,
                    erro
                );
            }
        }

        await atualizarListaFontesPersonalizadas();

        // Reaplica a preferência salva depois de carregar
        // as fontes personalizadas no navegador.
        output.style.fontFamily = fonteConsole;

    } catch (erro) {
        console.error(erro);

        customFontMessage.textContent =
            "Não foi possível acessar as fontes salvas neste navegador.";
    }
}


/* FONTES PADRÃO */

document
    .querySelectorAll('.font-list button[data-font]')
    .forEach(button => {
        button.addEventListener("click", () => {
            fonteConsole = button.dataset.font;

            output.style.fontFamily = fonteConsole;

            localStorage.setItem(
                "jssConsoleFonte",
                fonteConsole
            );
        });
    });


restaurarFontesPersonalizadas();
