<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSS Console</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;

            background: #151515;
            color: white;

            font-family: Arial, Helvetica, sans-serif;

            display: flex;
        }

        /* =========================================
           LADO ESQUERDO
           ========================================= */

        .left-panel {
            width: 35%;
            height: 100vh;

            padding: 30px;

            position: relative;

            background: #111;

            border-right: 1px solid #292929;

            overflow: hidden;
        }

       /* =========================================
   ÁREA DOS RETÂNGULOS
   ========================================= */

/* =========================================
   WRAPPER DO POPUP
   ========================================= */

.popup-wrapper {
    position: relative;

    width: 100%;
    height: 100%;

    overflow: hidden;
}


/* =========================================
   ÁREA DOS RETÂNGULOS
   ========================================= */

.popup-area {
    position: absolute;

    top: 55px;
    left: 0;
    right: 0;
    bottom: 0;

    padding: 0 14px 20px 0;

    overflow-y: scroll;
    overflow-x: hidden;

    scrollbar-width: none;
    -ms-overflow-style: none;

    overscroll-behavior: contain;
}

.popup-area::-webkit-scrollbar {
    width: 0;
    height: 0;
}


/* =========================================
   SCROLLBAR PERSONALIZADA
   ========================================= */

.custom-scrollbar {
    position: absolute;

    top: 55px;
    right: 2px;
    bottom: 0;

    width: 8px;

    background: rgba(54, 54, 54, 0.14901960784313725);

    z-index: 9999;

    pointer-events: none;
}


/* =========================================
   THUMB
   ========================================= */

.custom-scrollbar-thumb {
    position: absolute;

    top: 0;
    left: 1px;

    width: 6px;
    height: 40px;

    background: #ffffff;

    border-radius: 999px;

    pointer-events: auto;

    cursor: grab;

    user-select: none;
    touch-action: none;

    z-index: 10000;
}

.custom-scrollbar-thumb:hover {
    background: #cccccc;
}

.custom-scrollbar-thumb:active {
    background: #aaaaaa;
    cursor: grabbing;
}


        /* =========================================
           BOTÃO +
           ========================================= */

        .add-button {
            position: absolute;

            top: 0;
            left: 0;

            width: 42px;
            height: 42px;

            z-index: 100;

            background: #1f1f1f;

            border: 1px solid #353535;
            border-radius: 7px;

            color: #ffffff;

            font-size: 25px;
            font-weight: 300;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition:
                background 0.15s,
                border-color 0.15s,
                transform 0.15s;
        }

        .add-button:hover {
            background: #292929;
            border-color: #505050;

            transform: none;
        }

        .add-button:active {
            transform: scale(0.95);
        }

      /* =========================================
   BOTÃO -
   ========================================= */

.remove-all-button {
    position: absolute;

    top: 0;
    left: 50px;

    width: 42px;
    height: 42px;

    z-index: 100;

    background: #241515;

    border: 1px solid #4a2929;
    border-radius: 7px;

    color: #ff5f56;

    font-size: 25px;
    font-weight: 300;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    transition:
        background 0.15s,
        border-color 0.15s,
        transform 0.15s;
}

.remove-all-button:hover {
    background: #351b1b;
    border-color: #7a3a3a;

    transform: none;
}

.remove-all-button:active {
    transform: scale(0.95);
}
      
        /* =========================================
           RETÂNGULOS DOS TRECHOS
           ========================================= */

        .lyric-item {
            position: relative;

            width: 100%;
            min-height: 115px;

            margin-bottom: 12px;

            padding: 18px 150px 18px 18px;

            background: #181818;

            border: 1px solid #303030;
            border-radius: 9px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.18);

            transition:
                border-color 0.15s,
                background 0.15s;
        }

        .lyric-item:focus-within {
            border-color: #454545;
            background: #1b1b1b;
        }

        /* =========================================
           ÁREA DO TRECHO
           ========================================= */
.lyric-text {
    width: 100%;
    min-height: 78px;

    resize: none;

    background: transparent;

    border: none;
    outline: none;

    color: #eeeeee;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;

    line-height: 1.5;

    padding: 4px;

    /* Remove a scrollbar interna */
    overflow-y: hidden;
    overflow-x: hidden;

    /* Impede scrollbar nativa */
    scrollbar-width: none;
    -ms-overflow-style: none;
}

.lyric-text::-webkit-scrollbar {
    width: 0;
    height: 0;
    display: none;
}

               .lyric-text::placeholder {
            color: #666;
        }

        /* =========================================
           BOTÃO X
           ========================================= */

        .delete-button {
            position: absolute;

            top: 8px;
            right: 9px;

            width: 25px;
            height: 25px;

            padding: 0;

            background: transparent;

            color: #777;

            border: none;

            font-size: 17px;
            font-weight: normal;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            border-radius: 5px;

            transition:
                background 0.15s,
                color 0.15s;
        }

        .delete-button:hover {
            background: #2d2d2d;
            color: #ff5f56;
        }

        /* =========================================
           BLOQUINHOS NUMÉRICOS
           ========================================= */

        .number-fields {
            position: absolute;

            right: 14px;
            top: 50%;

            transform: translateY(-50%);

            width: 115px;

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 5px;
        }

        .number-field {
            width: 25px;
            height: 32px;

            padding: 0;

            background: #101010;

            border: 1px solid #343434;
            border-radius: 5px;

            color: #eeeeee;

            text-align: center;

            font-size: 11px;
            font-family: Arial, Helvetica, sans-serif;

            outline: none;

            transition:
                border-color 0.15s,
                background 0.15s;
        }

        .number-field:focus {
            background: #151515;
            border-color: #626262;
        }

        /* Remove setinhas dos inputs number */

        .number-field::-webkit-inner-spin-button,
        .number-field::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .number-field {
            appearance: textfield;
            -moz-appearance: textfield;
        }


        /* =========================================
           LADO DIREITO
           ========================================= */

        .right-panel {
            width: 65%;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px;

            background: #1b1b1b;
        }


        /* =========================================
           QUADRADO BRANCO
           ========================================= */

        .console-container {
            width: min(700px, 90%);
            aspect-ratio: 1 / 1;

            background: white;

            padding: 18px;

            border-radius: 8px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45);

            display: flex;
            flex-direction: column;
            gap: 12px;
        }


        /* =========================================
           BARRA SUPERIOR
           ========================================= */

        .console-header {
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            color: #111;

            font-size: 13px;
            font-weight: bold;
        }

        .console-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

.status {
    position: relative;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #27c93f;

    box-shadow:
        0 0 8px rgba(39, 201, 63, 0.6);

    flex-shrink: 0;
}

        /* =========================================
           BOTÕES
           ========================================= */

        .buttons {
            display: flex;
            gap: 6px;
        }

        button {
            border: none;

            padding: 7px 12px;

            border-radius: 5px;

            cursor: pointer;

            font-size: 12px;
            font-weight: bold;

            transition: 0.15s;
        }

        #downloadButton {
    background: #e9e9e9;
    color: #111;
}

#downloadButton:hover {
    background: #d5d5d5;
}

#playButton {
    width: 32px;
    height: 30px;

    padding: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #111;
    color: white;

    font-size: 11px;
}

#playButton:hover {
    background: #333;
}

#playButton:active {
    transform: scale(0.94);
}

        /* =========================================
           CONSOLE
           ========================================= */

        #console {
            flex: 1;
            min-height: 0;

            background: #050505;

            border-radius: 5px;

            padding: 16px;

            color: white;

            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;

            font-size: 14px;

            line-height: 1.5;

            overflow-y: auto;

            white-space: pre-wrap;

            word-break: break-word;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .console-line {
            margin-bottom: 3px;
        }

        .console-log {
            color: #ffffff;
        }

        .console-info {
            color: #62b0ff;
        }

        .console-warn {
            color: #ffd166;
        }

        .console-error {
            color: #ff5f56;
        }

        .console-success {
            color: #55efc4;
        }


        /* =========================================
           RESPONSIVO
           ========================================= */

        @media (max-width: 800px) {

            body {
                flex-direction: column;
                overflow: auto;
            }

            .left-panel {
              order: 2;
                width: 100%;
                height: 35vh;

                border-right: none;
                border-bottom: 1px solid #292929;
            }

            .right-panel {
              order: 1;
                width: 100%;
                height: 65vh;

                padding: 20px;
            }

            .console-container {
                width: 95%;
            }
        }

      /* ==================================================
   CONFIGURAÇÕES
   ================================================== */

.console-title {
    cursor: pointer;
}


/* ==================================================
   FUNDO DO POPUP
   ================================================== */

.settings-overlay {
    position: fixed;

    inset: 0;

    background: rgba(0, 0, 0, 0.55);

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 50000;
}


/* ==================================================
   POPUP
   ================================================== */

.settings-popup {
    position: relative;

   width: min(360px, 90vw);
min-height: 0;

padding: 22px 24px;

    background: #ffffff;

    color: #111;

    border-radius: 10px;

    box-shadow:
        0 20px 70px rgba(0, 0, 0, 0.5);
}


/* ==================================================
   X
   ================================================== */

.settings-close {
    position: absolute;

    top: 8px;
    right: 9px;

    width: 28px;
    height: 28px;

    padding: 0;

    background: transparent;

    color: #777;

}

.settings-close:hover {

}


/* ==================================================
   OPÇÕES
   ================================================== */

.settings-screen {
    width: 100%;
}

.settings-option {
    width: 100%;
    min-height: 48px;

    padding: 10px 0;

    display: flex;

    align-items: center;
    justify-content: space-between;

    background: transparent;

    color: #111;

    border: none;

    font-size: 13px;

    text-align: left;
}


/* ==================================================
   QUADRADO DA COR
   ================================================== */

.color-preview {
    width: 28px;
    height: 28px;

    padding: 0;

    border: 1px solid #bbbbbb;

    border-radius: 5px;

    cursor: pointer;
}


/* ==================================================
   FONTE
   ================================================== */

.font-option {
    cursor: pointer;

    border-top: 1px solid #eeeeee;
}

.font-option:hover {
    background: #f5f5f5;
}


/* ==================================================
   BOTÃO VOLTAR
   ================================================== */

.back-button {
    padding: 6px 9px;

    background: #eeeeee;

    color: #111;

    border-radius: 5px;

    margin-bottom: 18px;
}

.back-button:hover {
    background: #dddddd;
}


.settings-screen h3 {
    margin: 0 0 18px;

    font-size: 14px;
}


/* ==================================================
   SELETOR RGB
   ================================================== */

.rgb-picker {
    width: 100%;
}


/* ==================================================
   GRADIENTE
   ================================================== */

.color-gradient {
    position: relative;

    width: 100%;
    height: 150px;

    border-radius: 7px;

    overflow: hidden;

    cursor: crosshair;

    background:
        linear-gradient(
            to bottom,
            transparent,
            #000000
        ),
        linear-gradient(
            to right,
            #ffffff,
            hsl(0, 100%, 50%)
        );
}


/* ==================================================
   CURSOR DO GRADIENTE
   ================================================== */

.color-gradient-cursor {
    position: absolute;

    width: 14px;
    height: 14px;

    border: 2px solid white;

    border-radius: 50%;

    box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.5);

    transform:
        translate(-50%, -50%);

    pointer-events: none;
}


/* ==================================================
   BARRA DE MATIZ
   ================================================== */

.hue-slider {
    position: relative;

    width: 100%;
    height: 14px;

    margin-top: 12px;

    border-radius: 999px;

    background:
        linear-gradient(
            to right,
            red,
            yellow,
            lime,
            cyan,
            blue,
            magenta,
            red
        );

    cursor: pointer;
}


/* ==================================================
   CURSOR DA MATIZ
   ================================================== */

.hue-slider-cursor {
    position: absolute;

    top: 50%;
    left: 0;

    width: 18px;
    height: 18px;

    border: 2px solid white;

    border-radius: 50%;

    box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.6);

    transform:
        translate(-50%, -50%);

    pointer-events: none;
}


/* ==================================================
   RGB
   ================================================== */

.rgb-values {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;

    margin-top: 18px;
}

.rgb-values label {
    display: flex;

    gap: 5px;

    font-size: 11px;

    color: #555;
}

.rgb-values input {
    width: 100%;

    height: 30px;

    padding: 0 7px;

    border: 1px solid #cccccc;

    border-radius: 5px;

    outline: none;

    color: #111;

    background: #ffffff;

    font-size: 12px;
}

.rgb-values input:focus {
    border-color: #777777;
}


/* ==================================================
   COR ATUAL
   ================================================== */

.selected-color {
    margin-top: 12px;

    padding: 8px;

    border: 1px solid #dddddd;

    border-radius: 5px;

    font-family:
        "SFMono-Regular",

        monospace;

    text-align: center;

}


/* ==================================================
   LISTA DE FONTES
   ================================================== */

.font-list {
    display: flex;

    flex-direction: column;

    gap: 6px;
}

.font-list button {
    width: 100%;

    padding: 10px;

    background: #eeeeee;

    color: #111;

    text-align: left;

    border-radius: 5px;
}

.font-list button:hover {
    background: #dddddd;
}
      
    </style>
</head>

<body>

<script>

    /* ==================================================
       EDITOR DE TRECHOS
       ================================================== */

    const addButton =
        document.getElementById("addButton");
  
    const removeAllButton =
    document.getElementById("removeAllButton");

    const lyricList =
        document.getElementById("lyricList");

/* ==================================================
   ROLAGEM PERSONALIZADA
   ================================================== */

const popupArea =
    document.getElementById("popupArea");

const customScrollbar =
    document.getElementById("customScrollbar");

const customScrollbarThumb =
    document.getElementById("customScrollbarThumb");


/* ==================================================
   ATUALIZA SCROLLBAR
   ================================================== */

function atualizarScrollbar() {

    const alturaVisivel = popupArea.clientHeight;
    const alturaTotal = popupArea.scrollHeight;
    const alturaBarra = customScrollbar.clientHeight;

    console.log({
        alturaVisivel,
        alturaTotal,
        alturaBarra
    });

    if (
        alturaBarra <= 0 ||
        alturaTotal <= alturaVisivel
    ) {
        customScrollbar.style.visibility = "hidden";
        return;
    }

    customScrollbar.style.visibility = "visible";

    const proporcao =
        alturaVisivel / alturaTotal;

    const alturaThumb =
        Math.max(
            38,
            alturaBarra * proporcao
        );

    customScrollbarThumb.style.height =
        `${alturaThumb}px`;

    const maxScroll =
        alturaTotal - alturaVisivel;

    const maxThumb =
        alturaBarra - alturaThumb;

    const porcentagem =
        maxScroll > 0
            ? popupArea.scrollTop / maxScroll
            : 0;

    customScrollbarThumb.style.transform =
        `translateY(${maxThumb * porcentagem}px)`;
}


/* ==================================================
   SCROLL
   ================================================== */

popupArea.addEventListener(
    "scroll",
    atualizarScrollbar
);


/* ==================================================
   RESIZE DA JANELA
   ================================================== */

window.addEventListener(
    "resize",
    atualizarScrollbar
);


const observer = new ResizeObserver(() => {
    requestAnimationFrame(atualizarScrollbar);
});

observer.observe(popupArea);
observer.observe(lyricList);

/* ==================================================
   INICIALIZA
   ================================================== */

requestAnimationFrame(
    atualizarScrollbar
);


/* ==================================================
   ARRASTAR THUMB
   ================================================== */

let arrastandoScrollbar = false;

let inicioMouseY = 0;

let inicioScroll = 0;


/*
    Começou o arraste
*/

customScrollbarThumb.addEventListener(
    "pointerdown",
    (event) => {

        arrastandoScrollbar = true;

        inicioMouseY =
            event.clientY;

        inicioScroll =
            popupArea.scrollTop;


        event.preventDefault();


        customScrollbarThumb.setPointerCapture(
            event.pointerId
        );


        customScrollbarThumb.style.cursor =
            "grabbing";
    }

    (event) => {

        if (!arrastandoScrollbar) {
            return;

        const deslocamento =
            event.clientY -
            inicioMouseY;


        const alturaVisivel =
            popupArea.clientHeight;

        const alturaTotal =
            popupArea.scrollHeight;

        const alturaBarra =
            customScrollbar.clientHeight;

        const alturaThumb =
            customScrollbarThumb.offsetHeight;


        const maxScroll =
            alturaTotal -
            alturaVisivel;


        const maxThumb =
            alturaBarra -
            alturaThumb;


        if (
            maxScroll <= 0 ||
            maxThumb <= 0
        ) {
            return;
        }


        /*
            Conversão:

            movimento do mouse
            ↓
            movimento do thumb
            ↓
            movimento do conteúdo
        */

        const novoScroll =
            inicioScroll +
            (
                deslocamento /
                maxThumb
            ) *
            maxScroll;


        popupArea.scrollTop =
            Math.max(
                0,
                Math.min(
                    maxScroll,
                    novoScroll
                )
            );
    }
);

/* ==================================================
   DESENHA O CONSOLE NO CANVAS
   ================================================== */

function desenharConsoleNoCanvas() {

    if (!gravandoConsole) {
        return;
    }

    const largura =
        output.clientWidth;

    const altura =
        output.clientHeight;

    if (
        largura <= 0 ||
        altura <= 0
    ) {
        animationGravacao =
            requestAnimationFrame(
                desenharConsoleNoCanvas
            );

        return;
    }


    const escala = 1;

    canvasGravacao.width =
        largura * escala;

    canvasGravacao.height =
        altura * escala;


    contextoGravacao.clearRect(
        0,
        0,
        canvasGravacao.width,
        canvasGravacao.height
    );


    /* =========================================
       FUNDO
       ========================================= */

    contextoGravacao.fillStyle =
        getComputedStyle(output)
            .backgroundColor;

    contextoGravacao.fillRect(
        0,
        0,
        canvasGravacao.width,
        canvasGravacao.height
    );


    /* =========================================
       FONTE
       ========================================= */

    const estilo =
        getComputedStyle(output);

    const tamanhoFonte =
        parseFloat(
            estilo.fontSize
        );

    const alturaLinha =
        parseFloat(
            estilo.lineHeight
        );


    contextoGravacao.font =
        `${tamanhoFonte}px ${estilo.fontFamily}`;

    contextoGravacao.textAlign =
        "center";

    contextoGravacao.textBaseline =
        "middle";


    /* =========================================
       LINHAS
       ========================================= */

    const linhas =
        output.querySelectorAll(
            ".console-line"
        );


    const linhasArray =
        Array.from(linhas);


    if (linhasArray.length === 0) {

        animationGravacao =
            requestAnimationFrame(
                desenharConsoleNoCanvas
            );

        return;
    }


    const espaco =
        alturaLinha + 3;


    const alturaTotal =
        linhasArray.length * espaco;


    let y =
        (
            altura -
            alturaTotal
        ) / 2 +
        espaco / 2;


    for (const linha of linhasArray) {

        const estiloLinha =
            getComputedStyle(linha);


        contextoGravacao.fillStyle =
            estiloLinha.color;


        contextoGravacao.fillText(
            linha.textContent,
            largura / 2,
            y
        );


        y += espaco;
    }


    animationGravacao =
        requestAnimationFrame(
            desenharConsoleNoCanvas
        );
}


/* ==================================================
   INICIA GRAVAÇÃO
   ================================================== */

async function iniciarGravacaoConsole() {

    canvasGravacao =
        document.createElement("canvas");

    canvasGravacao.width =
        output.clientWidth;

    canvasGravacao.height =
        output.clientHeight;


    contextoGravacao =
        canvasGravacao.getContext("2d");


    const stream =
        canvasGravacao.captureStream(30);


    partesGravacao = [];


    mediaRecorder =
        new MediaRecorder(
            stream,
            {
                mimeType:
                    "video/webm;codecs=vp8"
            }
        );


    mediaRecorder.ondataavailable =
        event => {

            if (
                event.data &&
                event.data.size > 0
            ) {

                partesGravacao.push(
                    event.data
                );

            }
        };


    gravandoConsole = true;


    desenharConsoleNoCanvas();


    mediaRecorder.start(100);
}


/* ==================================================
   PARA GRAVAÇÃO
   ================================================== */

function pararGravacaoConsole() {

    return new Promise(resolve => {

        if (!mediaRecorder) {
            resolve(null);
            return;
        }


        mediaRecorder.onstop =
            () => {

                gravandoConsole = false;


                if (animationGravacao) {

                    cancelAnimationFrame(
                        animationGravacao
                    );

                    animationGravacao =
                        null;
                }


                const blob =
                    new Blob(
                        partesGravacao,
                        {
                            type:
                                "video/webm"
                        }
                    );


                resolve(blob);
            };


        mediaRecorder.stop();
    });
}


/* ==================================================
   CONVERTE WEBM → MP4
   ================================================== */
let ffmpeg = null;
let ffmpegCarregado = false;

async function converterParaMP4(webmBlob) {

    if (!ffmpegCarregado) {

        if (!window.FFmpegWASM) {

            await new Promise((resolve, reject) => {

                const script =
                    document.createElement("script");

                script.src =
                    "./ffmpeg/ffmpeg.js";

                script.onload = resolve;

                script.onerror = () => {
                    reject(
                        new Error(
                            "Não foi possível carregar ffmpeg.js"
                        )
                    );
                };

                document.head.appendChild(script);
            });
        }

        if (!window.FFmpegWASM) {
            throw new Error(
                "FFmpegWASM não foi encontrado."
            );
        }

        ffmpeg =
            new FFmpegWASM.FFmpeg();

        ffmpeg.on(
            "log",
            ({ message }) => {
                console.log("[FFmpeg]", message);
            }
        );

        
await ffmpeg.load({
    coreURL: new URL(
        "ffmpeg/ffmpeg-core.js",
        document.baseURI
    ).href,

    wasmURL: new URL(
        "ffmpeg/ffmpeg-core.wasm",
        document.baseURI
    ).href
});
    

        ffmpegCarregado = true;
    }

    await ffmpeg.writeFile(
        "entrada.webm",
        new Uint8Array(
            await webmBlob.arrayBuffer()
        )
    );

    await ffmpeg.exec([
        "-i",
        "entrada.webm",
        "-c:v",
        "libx264",
        "-pix_fmt",
        "yuv420p",
        "-movflags",
        "+faststart",
        "saida.mp4"
    ]);

    const arquivo =
        await ffmpeg.readFile(
            "saida.mp4"
        );

    return new Blob(
        [arquivo.buffer],
        {
            type: "video/mp4"
        }
    );
}

/* ==================================================
   CONVERSÃO RGB → HSV
   ================================================== */

function rgbToHsv(r, g, b) {

    r /= 255;
    g /= 255;
    b /= 255;

    const maior =
        Math.max(r, g, b);

    const menor =
        Math.min(r, g, b);

    const diferenca =
        maior - menor;

    let h = 0;
    let s = 0;

    const v = maior;

    if (diferenca !== 0) {

        s =
            diferenca / maior;

        if (maior === r) {

            h =
                60 *
                (
                    ((g - b) / diferenca) % 6
                );

        } else if (maior === g) {

            h =
                60 *
                (
                    ((b - r) / diferenca) + 2
                );

        } else {

            h =
                60 *
                (
                    ((r - g) / diferenca) + 4
                );

        }

    }

    if (h < 0) {
        h += 360;
    }

    return {
        h,
        s,
        v
    };
}


/* ==================================================
   CONVERSÃO HSV → RGB
   ================================================== */

function hsvToRgb(h, s, v) {

    const c =
        v * s;

    const x =
        c *
        (
            1 -
            Math.abs(
                ((h / 60) % 2) - 1
            )
        );

    const m =
        v - c;

    let r = 0;
    let g = 0;
    let b = 0;

    if (h < 60) {

        r = c;
        g = x;

    } else if (h < 120) {

        r = x;
        g = c;

    } else if (h < 180) {

        g = c;
        b = x;

    } else if (h < 240) {

        g = x;
        b = c;

    } else if (h < 300) {

        r = x;
        b = c;

    } else {

        r = c;
        b = x;

    }

    return {
        r: Math.round((r + m) * 255),
        g: Math.round((g + m) * 255),
        b: Math.round((b + m) * 255)
    };
}


/* ==================================================
   HEX → RGB
   ================================================== */

function hexToRgb(hex) {

    hex =
        hex.replace("#", "");

    return {
        r: parseInt(
            hex.slice(0, 2),
            16
        ),

        g: parseInt(
            hex.slice(2, 4),
            16
        ),

        b: parseInt(
            hex.slice(4, 6),
            16
        )
    };
}


/* ==================================================
   RGB → HEX
   ================================================== */

function rgbToHex(r, g, b) {

    return "#" +
        [r, g, b]
            .map(valor =>
                valor
                    .toString(16)
                    .padStart(2, "0")
            )
            .join("");
}


/* ==================================================
   MATIZ ATUAL
   ================================================== */

let hsvAtual =
    rgbToHsv(
        ...Object.values(
            hexToRgb(corConsole)
        )
    );


/* ==================================================
   ATUALIZA VISUAL DO GRADIENTE
   ================================================== */

function atualizarGradiente() {

    colorGradient.style.background =
        `
        linear-gradient(
            to bottom,
            transparent,
            #000000
        ),
        linear-gradient(
            to right,
            #ffffff,
            hsl(${hsvAtual.h}, 100%, 50%)
        )
        `;


    colorGradientCursor.style.left =
        `${hsvAtual.s * 100}%`;

    colorGradientCursor.style.top =
        `${(1 - hsvAtual.v) * 100}%`;


    hueSliderCursor.style.left =
        `${(hsvAtual.h / 360) * 100}%`;
}


/* ==================================================
   ATUALIZA COR
   ================================================== */

function aplicarCorRGB(r, g, b) {

    r =
        Math.max(
            0,
            Math.min(
                255,
                Math.round(r)
            )
        );

    g =
        Math.max(
            0,
            Math.min(
                255,
                Math.round(g)
            )
        );

    b =
        Math.max(
            0,
            Math.min(
                255,
                Math.round(b)
            )
        );


    corConsole =
        rgbToHex(
            r,
            g,
            b
        );


    output.style.background =
        corConsole;

    colorPreview.style.background =
        corConsole;

    status.style.background =
        corConsole;


    redValue.value = r;
    greenValue.value = g;
    blueValue.value = b;


    selectedColor.textContent =
        corConsole;


    localStorage.setItem(
        "jssConsoleCor",
        corConsole
    );
}


/* ==================================================
   SINCRONIZA SELETOR
   ================================================== */

function sincronizarSeletor() {

    const rgb =
        hexToRgb(corConsole);

    hsvAtual =
        rgbToHsv(
            rgb.r,
            rgb.g,
            rgb.b
        );


    redValue.value =
        rgb.r;

    greenValue.value =
        rgb.g;

    blueValue.value =
        rgb.b;


    selectedColor.textContent =
        corConsole;


    atualizarGradiente();
}


/* ==================================================
   CLICAR / ARRASTAR NO GRADIENTE
   ================================================== */

function atualizarPeloGradiente(event) {

    const rect =
        colorGradient.getBoundingClientRect();

    let x =
        (event.clientX - rect.left)
        / rect.width;

    let y =
        (event.clientY - rect.top)
        / rect.height;


    x =
        Math.max(
            0,
            Math.min(1, x)
        );

    y =
        Math.max(
            0,
            Math.min(1, y)
        );


    hsvAtual.s = x;
    hsvAtual.v = 1 - y;


    const rgb =
        hsvToRgb(
            hsvAtual.h,
            hsvAtual.s,
            hsvAtual.v
        );


    aplicarCorRGB(
        rgb.r,
        rgb.g,
        rgb.b
    );

    atualizarGradiente();
}


let arrastandoGradiente = false;


colorGradient.addEventListener(
    "pointerdown",
    event => {

        arrastandoGradiente = true;

        colorGradient.setPointerCapture(
            event.pointerId
        );

        atualizarPeloGradiente(event);
    }
);


colorGradient.addEventListener(
    "pointermove",
    event => {

        if (!arrastandoGradiente) {
            return;
        }

        atualizarPeloGradiente(event);
    }
);


colorGradient.addEventListener(
    "pointerup",
    () => {

        arrastandoGradiente = false;
    }
);


colorGradient.addEventListener(
    "pointercancel",
    () => {

        arrastandoGradiente = false;
    }
);


/* ==================================================
   CLICAR / ARRASTAR NA MATIZ
   ================================================== */

function atualizarPelaMatiz(event) {

    const rect =
        hueSlider.getBoundingClientRect();

    let x =
        (event.clientX - rect.left)
        / rect.width;


    x =
        Math.max(
            0,
            Math.min(1, x)
        );


    hsvAtual.h =
        x * 360;


    atualizarGradiente();


    const rgb =
        hsvToRgb(
            hsvAtual.h,
            hsvAtual.s,
            hsvAtual.v
        );


    aplicarCorRGB(
        rgb.r,
        rgb.g,
        rgb.b
    );

    atualizarGradiente();
}


let arrastandoMatiz = false;


hueSlider.addEventListener(
    "pointerdown",
    event => {

        arrastandoMatiz = true;

        hueSlider.setPointerCapture(
            event.pointerId
        );

        atualizarPelaMatiz(event);
    }
);


hueSlider.addEventListener(
    "pointermove",
    event => {

        if (!arrastandoMatiz) {
            return;
        }

        atualizarPelaMatiz(event);
    }
);


hueSlider.addEventListener(
    "pointerup",
    () => {

        arrastandoMatiz = false;
    }
);


hueSlider.addEventListener(
    "pointercancel",
    () => {

        arrastandoMatiz = false;
    }
);


/* ==================================================
   CAMPOS RGB
   ================================================== */

function atualizarPelosCampos() {

    let r =
        Number(redValue.value);

    let g =
        Number(greenValue.value);

    let b =
        Number(blueValue.value);


    if (Number.isNaN(r)) r = 0;
    if (Number.isNaN(g)) g = 0;
    if (Number.isNaN(b)) b = 0;


    r =
        Math.max(
            0,
            Math.min(255, r)
        );

    g =
        Math.max(
            0,
            Math.min(255, g)
        );

    b =
        Math.max(
            0,
            Math.min(255, b)
        );


    hsvAtual =
        rgbToHsv(
            r,
            g,
            b
        );


    aplicarCorRGB(
        r,
        g,
        b
    );

    atualizarGradiente();
}


[
    redValue,
    greenValue,
    blueValue
]
.forEach(input => {

    input.addEventListener(
        "input",
        atualizarPelosCampos
    );

});


/* ==================================================
   FONTE ATUAL
   ================================================== */

let fonteConsole =
    localStorage.getItem("jssConsoleFonte")
    || '"SFMono-Regular", Consolas, "Liberation Mono", monospace';


output.style.fontFamily =
    fonteConsole;

   ABRIR CONFIGURAÇÕES

        settingsOverlay.style.display =
            "flex";

        settingsMain.style.display =
            "block";

    }
);


/* ==================================================
   ABRIR COR
   ================================================== */

colorPreview.addEventListener(
    "click",
    () => {

        settingsMain.style.display =
            "none";

        colorScreen.style.display =
            "block";

        sincronizarSeletor();
    }

/* ==================================================
   VOLTAR DA COR
   ================================================== */

colorBack.addEventListener(
    "click",
    () => {

        colorScreen.style.display =
            "none";

        settingsMain.style.display =
            "block";
    }
);


/* ==================================================
   ABRIR FONTES
   ================================================== */

fontOption.addEventListener(
    "click",
    () => {

        settingsMain.style.display =
            "none";

        fontScreen.style.display =
            "block";
    }
);


/* ==================================================
   ESCOLHER FONTE
   ================================================== */

document
    .querySelectorAll(".font-list button")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                fonteConsole =
                    button.dataset.font;

                output.style.fontFamily =
                    fonteConsole;

                localStorage.setItem(
                    "jssConsoleFonte",
                    fonteConsole
                );
            }
        );

    });


/* ==================================================
   VOLTAR DAS FONTES
   ================================================== */

fontBack.addEventListener(
    "click",
    () => {

        fontScreen.style.display =
            "none";

        settingsMain.style.display =
            "block";
    }
);


/* ==================================================
   INICIALIZA SELETOR
   ================================================== */

sincronizarSeletor();
/* ==================================================
   VOLTAR DAS FONTES
   ================================================== */

fontBack.addEventListener(
    "click",
    () => {

        fontScreen.style.display =
            "none";

        settingsMain.style.display =
            "block";
    }
);
  
</script>
